<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan des salles — Förena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--marine:#273045;--accent:#d0a593;--ivoire:#F7F4EF;--gris:#C9CED8;--txt:#1f2330;--sub:#6b7080;--bg:#F7F4EF;--carte:#fff;
  --masso:#273045;--masso-t:#fff;--duo:#d0a593;--esthe:#EADDC3;--recours:#F2B880;--test:#9aa3b8;--vide:#eef0f3;--moi:#e8b923}
@media (prefers-color-scheme:dark){:root{--txt:#e9e9ee;--sub:#a3a8b5;--bg:#14161c;--carte:#1c1f27;--vide:#262a33;--gris:#3a3f4c;--ivoire:#1c1f27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}
header{background:var(--marine);color:#fff;padding:14px 16px 12px}
header .marque{font-family:"PT Serif",serif;font-weight:700;letter-spacing:.32em;font-size:1.15rem}
header{position:relative}.btn-ads{position:absolute;right:12px;top:14px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px;font-size:.8rem}
header .sous{color:var(--accent);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
.barre{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px 16px;max-width:1200px;margin:0 auto}
.barre label{display:flex;flex-direction:column;font-size:.75rem;color:var(--sub);gap:4px;text-transform:uppercase;letter-spacing:.06em}
select,button{font:inherit;font-size:1rem;padding:9px 10px;border-radius:8px;border:1px solid var(--gris);background:var(--carte);color:var(--txt);min-width:0}
#nom{min-width:240px}
button.nav{width:44px;padding:9px 0}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.carte{background:var(--carte);border-radius:12px;padding:14px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
h2{font-family:"PT Serif",serif;color:var(--marine);margin:0 0 8px;font-size:1.15rem}
@media (prefers-color-scheme:dark){h2{color:#c9d3ec}}
.moi-res{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.moi-res .gros{font-size:2.2rem;font-weight:700;color:var(--marine);font-family:"PT Serif",serif}
@media (prefers-color-scheme:dark){.moi-res .gros{color:#fff}}
.pastille{display:inline-block;background:var(--moi);color:#222;border-radius:999px;padding:3px 10px;font-weight:600;font-size:.85rem}
.alerte{color:#b3261e;font-weight:600}
/* plan */
.plan{display:grid;grid-template-columns:repeat(24,1fr);grid-auto-rows:minmax(16px,auto);gap:3px;min-width:640px}
.plan-wrap{overflow-x:auto}
.salle{border-radius:6px;padding:4px 5px;font-size:.72rem;line-height:1.25;overflow:hidden;position:relative;background:var(--masso);color:var(--masso-t)}
.salle .num{font-weight:700;font-size:.95rem;display:block}
.salle.duo{background:var(--duo);color:#273045}.salle.esthe{background:var(--esthe);color:#273045}
.salle .seg{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.salle .seg.r{background:var(--recours);color:#222;border-radius:3px;padding:0 3px;margin-top:1px}
.salle.moi{outline:4px solid var(--moi);outline-offset:1px;box-shadow:0 0 0 7px rgba(232,185,35,.25)}
.salle .seg.moi{background:var(--moi);color:#222;border-radius:3px;padding:0 3px;font-weight:700}
.ads{border-radius:6px;background:#A9C4B6;color:#1f3a30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.8rem;padding:4px}
.ads small{font-weight:400;font-size:.68rem}
.zone{border-radius:6px;background:var(--vide);color:var(--sub);font-size:.7rem;display:flex;align-items:center;justify-content:center;font-style:italic}
.libre{opacity:.55;font-style:italic}
/* grille */
table{border-collapse:separate;border-spacing:2px;width:100%;min-width:900px;font-size:.72rem;table-layout:fixed}
td.h,th:first-child{width:52px}
th{background:var(--marine);color:#fff;padding:5px 3px;border-radius:4px;font-weight:600}
th.duo{background:var(--duo);color:#273045}th.esthe{background:var(--esthe);color:#273045}
td{background:var(--vide);border-radius:4px;padding:4px 3px;text-align:center;height:34px;vertical-align:middle;word-break:break-word}
td.h{background:transparent;font-weight:700;color:var(--sub);text-align:right;padding-right:6px;white-space:nowrap}
td.masso{background:#dfe5f2;color:#1f2a44}td.esthe{background:var(--esthe);color:#273045}td.recours{background:var(--recours);color:#222}
td.test{background:var(--test);color:#fff}td.ajustement{background:#efe2f5;color:#4b2a5e}
@media (prefers-color-scheme:dark){td.masso{background:#2c3550;color:#e6ebf7}}
td.moi{background:var(--moi)!important;color:#222!important;font-weight:700}
.grille-wrap{overflow-x:auto}
.legende{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--sub);margin-top:8px}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.pied{color:var(--sub);font-size:.75rem;text-align:center;margin-top:18px}
/* ma journée : ligne du temps */
.ligne-temps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ligne-temps li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;background:var(--vide)}
.ligne-temps .t{font-weight:700;min-width:3.4em;color:var(--sub)}
.ligne-temps .s{font-weight:700;font-size:1.05rem}
.ligne-temps li.pause{background:transparent;border:1px dashed var(--gris);color:var(--sub);font-style:italic}
.ligne-temps li.maint{outline:2px solid var(--moi)}
.choisir{color:var(--sub)}
/* par heure (mobile) */
.puces{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.puces button{flex:0 0 auto;border-radius:999px;padding:7px 12px;font-size:.9rem}
.puces button.on{background:var(--marine);color:#fff;border-color:var(--marine)}
.puces button.mienne:not(.on){border-color:var(--moi);box-shadow:inset 0 0 0 1px var(--moi)}
.liste-h{display:flex;flex-direction:column;gap:6px}
.liste-h div{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--vide)}
.liste-h b{min-width:4.6em}
.liste-h .esthe{background:var(--esthe);color:#273045}.liste-h .recours{background:var(--recours);color:#222}
.liste-h .duo{background:var(--duo);color:#273045}.liste-h .test{background:var(--test);color:#fff}
.liste-h .moi{background:var(--moi)!important;color:#222!important;font-weight:700}
.liste-h .vide{color:var(--sub);font-style:italic}
.seulement-mobile{display:none}
/* fiche d'une salle */
.fiche{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20}
.fiche>div{background:var(--carte);color:var(--txt);width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}
.fiche h3{margin:0 0 10px;font-family:"PT Serif",serif;font-size:1.3rem}
.fiche .l{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--vide)}
.fiche .l.moi{font-weight:700;color:#8a6a00}
.fiche button{width:100%;margin-top:12px}
/* onglets (mobile) */
.onglets{display:none}
@media (max-width:700px){
  header{padding:10px 16px 8px}header .sous{font-size:.65rem}
  .barre{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 8px;gap:6px;box-shadow:0 1px 0 var(--gris)}
  .barre label{font-size:0;gap:0}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .carte{padding:12px}
  .onglets{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--carte);border-top:1px solid var(--gris);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .onglets button{flex:1;border:0;background:transparent;font-size:.8rem;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
  .onglets button span{font-size:1.25rem;line-height:1}
  .onglets button.on{color:var(--marine);font-weight:700}
  @media (prefers-color-scheme:dark){.onglets button.on{color:#fff}}
  body[data-onglet] main>[data-onglet]{display:none}
  body[data-onglet="moi"] main>[data-onglet="moi"]:not([hidden]),body[data-onglet="plan"] main>[data-onglet="plan"],body[data-onglet="heure"] main>[data-onglet="heure"]{display:block}
  .seulement-mobile{display:block}.seulement-bureau{display:none}
  .plan{min-width:0;gap:2px}
  .salle{padding:3px;font-size:.6rem;cursor:pointer}
  .salle .num{font-size:.85rem}
  .salle .seg{display:none}.salle .seg.libre{display:block}
  .salle .qui{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .ads,.zone{font-size:.55rem}.ads small{display:none}
  .legende{gap:8px;font-size:.7rem}
  .moi-res .gros{font-size:1.9rem}
}
@media (min-width:701px){.salle .qui{display:none}}
.ferme{font-size:1.1rem;padding:30px;text-align:center;color:var(--sub)}
@media (max-width:700px){#nom{min-width:0;width:100%}.barre label{flex:1 1 100%;min-width:0;width:100%}.barre label span{width:100%}#jour{flex:1;min-width:0}}
</style>
</head>
<body>
<header><button id="btn-ads" class="btn-ads" type="button">Mode accueil</button><div class="marque">FÖRENA</div><div class="sous">Plan des salles · soins</div></header>
<div class="barre">
  <label>Journée
    <span style="display:flex;gap:6px"><button class="nav" id="prec" aria-label="Jour précédent">‹</button><select id="jour"></select><button class="nav" id="suiv" aria-label="Jour suivant">›</button></span>
  </label>
  <label class="n">Mon nom<select id="nom"><option value="">— Choisir mon nom —</option></select></label>
</div>
<main>
  <section class="carte" id="moi" data-onglet="moi" hidden></section>
  <section class="carte" id="ads" data-onglet="moi" hidden></section>
  <section class="carte seulement-mobile choisir" id="choisir" data-onglet="moi" hidden>Choisis ton nom en haut pour voir ta journée.</section>
  <section class="carte" data-onglet="plan"><h2>Plan de la journée</h2><div class="plan-wrap"><div class="plan" id="plan"></div></div>
    <div class="legende"><span><i style="background:var(--masso)"></i>Massothérapie</span><span><i style="background:var(--duo)"></i>Duo (13, 15)</span><span><i style="background:var(--esthe)"></i>Esthétique (5, 9)</span><span><i style="background:var(--recours)"></i>Masso en dernier recours</span><span><i style="background:var(--moi)"></i>Ma salle</span><span><i style="background:#A9C4B6"></i>ADS · accueil des soins</span></div>
  </section>
  <section class="carte" data-onglet="heure"><h2>Heure par heure</h2><div class="seulement-mobile" id="parheure"></div><div class="grille-wrap seulement-bureau" id="grille"></div></section>
  <div class="pied" id="pied"></div>
</main>
<nav class="onglets" id="onglets">
  <button type="button" data-o="moi"><span>◉</span>Ma journée</button>
  <button type="button" data-o="plan"><span>▦</span>Plan</button>
  <button type="button" data-o="heure"><span>◷</span>Par heure</button>
</nav>
<script src="moteur.js"></script>
<script src="ads.js" defer></script>
<script>
(async function () {
  const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const JOURS = {Lun:'lundi',Mar:'mardi',Mer:'mercredi',Jeu:'jeudi',Ven:'vendredi',Sam:'samedi',Dim:'dimanche'};
  const $ = id => document.getElementById(id);
  let data;
  try { data = await (await fetch('data/plan.json', {cache:'no-store'})).json(); }
  catch (e) { $('plan').textContent = 'Données indisponibles pour le moment.'; return; }
  const selJ = $('jour'), selN = $('nom');
  const libJour = j => { const [y,m,d] = j.date.split('-').map(Number); return `${JOURS[j.jour]||j.jour} ${d} ${MOIS[m-1]}` + (j.ferme ? ' (fermé)' : ''); };
  data.jours.forEach((j, i) => { const o = document.createElement('option'); o.value = i; o.textContent = libJour(j); selJ.appendChild(o); });
  const noms = [...new Set(data.reponses.filter(Boolean).map(r => r.nom))].sort((a,b)=>a.localeCompare(b,'fr'));
  noms.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; selN.appendChild(o); });
  // jour par défaut : aujourd'hui si dans le mois, sinon le 1er
  const auj = new Date(); const isoAuj = `${auj.getFullYear()}-${String(auj.getMonth()+1).padStart(2,'0')}-${String(auj.getDate()).padStart(2,'0')}`;
  let iDef = data.jours.findIndex(j => j.date === isoAuj); if (iDef < 0) iDef = 0;
  try { const n = localStorage.getItem('forena-nom'); if (n && noms.includes(n)) selN.value = n; } catch (e) {}
  const h = location.hash.replace('#','');
  const iHash = data.jours.findIndex(j => j.date === h);
  selJ.value = iHash >= 0 ? iHash : iDef;

  // positions du plan (grille 24 colonnes) — même disposition que le plan Excel
  const POS = {18:[2,1,6,5],17:[2,6,6,5],15:[2,11,6,7],13:[2,18,6,6],11:[2,24,6,5],
    16:[11,13,6,5],14:[11,18,6,4],12:[11,22,6,4],10:[11,26,6,3],
    1:[19,13,6,5],2:[19,18,6,4],3:[19,22,6,4],4:[19,26,6,3],
    9:[2,32,3,6],8:[5,32,5,6],7:[10,32,5,6],6:[15,32,6,6],5:[21,32,4,6]};
  const ZONES = [[8,1,3,28,'Corridor'],[11,1,4,10,'Toilettes'],[2,29,23,3,''],[11,11,14,2,''],[17,13,2,16,'']];
  const court = n => { const p = n.split(' '); return p.length > 1 ? `${p[0]} ${p[1][0]}.` : n; };

  const minutes = lab => { const [hh, mm] = lab.split('h').map(Number); return hh * 60 + (mm || 0); };
  function plageCourante(i) {
    if (data.jours[i].date !== isoAuj) return -1;
    const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
    let k = -1; data.plages.forEach((lab, j) => { if (m >= minutes(lab) - 10) k = j; }); return k;
  }
  function fiche(num, segs, nom) {
    const plages = data.plages;
    const d = document.createElement('div'); d.className = 'fiche';
    d.innerHTML = `<div><h3>Salle ${num}${(num===13||num===15)?' · Duo':(num===5||num===9)?' · Esthé':''}</h3>` +
      (segs.length ? segs.map(s => `<div class="l${nom && s.nom === nom ? ' moi' : ''}"><span>${s.type === 'test' ? s.nom : s.nom}</span><span>${plages[s.deb]}–${s.fin < 10 ? plages[s.fin] : '21h30'}</span></div>`).join('')
                   : '<div class="l"><span class="libre">Libre toute la journée</span></div>') +
      `<button type="button">Fermer</button></div>`;
    d.onclick = e => { if (e.target === d || e.target.tagName === 'BUTTON') d.remove(); };
    document.body.appendChild(d);
  }
  let plageChoisie = null;
  function parHeure(r, i, nom) {
    const plages = data.plages, ALL = Moteur.ALL, box = $('parheure');
    if (r.ferme) { box.innerHTML = '<div class="ferme">Le spa est fermé cette journée.</div>'; return; }
    const pc = plageCourante(i);
    const mesP = new Set(); r.grille.forEach((ligne, p) => ligne.forEach(c => { if (c && nom && c.nom === nom) mesP.add(p); }));
    if (plageChoisie === null || plageChoisie > 9) plageChoisie = pc >= 0 ? pc : (mesP.size ? Math.min(...mesP) : 0);
    const p = plageChoisie;
    let h = '<div class="puces">' + plages.map((lab, k) => `<button type="button" data-k="${k}" class="${k === p ? 'on' : ''}${mesP.has(k) ? ' mienne' : ''}">${lab}</button>`).join('') + '</div><div class="liste-h">';
    ALL.forEach((num, j) => {
      const c = r.grille[p][j]; const genre = (num===13||num===15) ? 'duo' : (num===5||num===9) ? 'esthe' : '';
      if (!c) { h += `<div class="${genre}"><b>Salle ${num}</b><span class="vide">libre</span></div>`; return; }
      const cl = nom && c.nom === nom ? 'moi' : (c.type === 'recours' ? 'recours' : c.type === 'test' ? 'test' : genre);
      h += `<div class="${cl}"><b>Salle ${num}</b><span>${c.nom}</span></div>`;
    });
    box.innerHTML = h + '</div>';
    box.querySelectorAll('.puces button').forEach(b => b.onclick = () => { plageChoisie = Number(b.dataset.k); parHeure(r, i, nom); });
    const on = box.querySelector('.puces .on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  let dernierJour = null;
  function rendre() {
    const i = Number(selJ.value), nom = selN.value;
    try { localStorage.setItem('forena-nom', nom); } catch (e) {}
    history.replaceState(null, '', '#' + data.jours[i].date);
    const r = Moteur.calculerJour(data, i);
    if (dernierJour !== i) { plageChoisie = null; dernierJour = i; }
    const plages = data.plages, ALL = Moteur.ALL;
    // ---- mon horaire
    const moi = $('moi');
    if (nom) {
      const p = r.personnes.concat(r.esthe).find(x => x.nom === nom);
      moi.hidden = false;
      if (r.ferme) moi.innerHTML = `<h2>${nom}</h2><div>Le spa est fermé cette journée.</div>`;
      else if (!p) moi.innerHTML = `<h2>${nom}</h2><div>Pas de soins prévus pour toi cette journée.</div>`;
      else {
        const salles = p.salles.length ? p.salles.join(' → ') : '—';
        const pc = plageCourante(i);
        let lt = '<ul class="ligne-temps">';
        p.plagesSalle.forEach((v, k) => {
          if (p.pause === plages[k]) lt += `<li class="pause"><span class="t">${plages[k]}</span>Pause</li>`;
          else if (v !== null) lt += `<li${k === pc ? ' class="maint"' : ''}><span class="t">${plages[k]}</span><span class="s">${v === 'sans' ? 'Sans salle' : 'Salle ' + v}</span></li>`;
        });
        lt += `</ul>`;
        moi.innerHTML = `<h2>${nom}</h2><div class="moi-res"><span class="gros">Salle ${salles}</span>
          <span>${p.debut} – ${p.fin}${p.pause ? ` · pause à ${p.pause}` : ''}</span>
          ${p.sans ? `<span class="alerte">${p.sans} plage(s) sans salle : voir ta superviseure</span>` : ''}</div>${lt}`;
      }
    } else moi.hidden = true;
    $('choisir').hidden = !!nom;
    // ---- plan
    const plan = $('plan'); plan.innerHTML = ''; let cible = null;
    ZONES.forEach(([x,y,w,hh,t]) => { const z = document.createElement('div'); z.className = 'zone'; z.style.gridColumn = `${x} / span ${w}`; z.style.gridRow = `${y} / span ${hh}`; z.textContent = t; plan.appendChild(z); });
    { const a = document.createElement('div'); a.className = 'ads'; a.style.gridColumn = '15 / span 4'; a.style.gridRow = '1 / span 10'; a.innerHTML = 'ADS<small>Accueil des soins</small>'; plan.appendChild(a); }
    ALL.forEach((num, j) => {
      const [x,y,w,hh] = POS[num];
      const el = document.createElement('div');
      el.className = 'salle' + ((num===13||num===15) ? ' duo' : (num===5||num===9) ? ' esthe' : '');
      el.style.gridColumn = `${x} / span ${w}`; el.style.gridRow = `${y} / span ${hh}`;
      let html = `<span class="num">${num}${(num===13||num===15)?' · Duo':(num===5||num===9)?' · Esthé':''}</span>`;
      const segs = [];
      for (let p = 0; p < 10; p++) {
        const c = r.grille[p][j]; if (!c) continue;
        const prev = segs[segs.length-1];
        if (prev && prev.nom === c.nom && prev.fin === p) { prev.fin = p+1; continue; }
        segs.push({nom:c.nom, type:c.type, deb:p, fin:p+1});
      }
      if (!segs.length) html += `<span class="seg libre">libre</span>`;
      else html += `<span class="qui">${[...new Set(segs.map(s => s.nom.split(' ')[0]))].join(', ')}</span>`;
      el.onclick = () => fiche(num, segs, nom);
      let mienne = false;
      segs.forEach(s => {
        const finL = s.fin < 10 ? plages[s.fin] : '21h30';
        const m = nom && s.nom === nom; if (m) mienne = true;
        html += `<span class="seg${s.type==='recours'?' r':''}${m?' moi':''}" title="${s.nom}">${court(s.nom)} · ${plages[s.deb]}–${finL}</span>`;
      });
      if (mienne) el.classList.add('moi');
      el.innerHTML = html; plan.appendChild(el);
      if (mienne) cible = el;
    });
    if (cible) { const w = plan.parentElement; requestAnimationFrame(() => { w.scrollLeft = Math.max(0, cible.offsetLeft - w.clientWidth / 2 + cible.offsetWidth / 2); }); }
    if (r.ferme) { plan.innerHTML = '<div class="ferme" style="grid-column:1/-1">Le spa est fermé cette journée.</div>'; }
    // ---- grille
    let t = '<table><thead><tr><th></th>' + ALL.map(n => `<th class="${(n===13||n===15)?'duo':(n===5||n===9)?'esthe':''}">${n}</th>`).join('') + '</tr></thead><tbody>';
    for (let p = 0; p < 10; p++) {
      t += `<tr><td class="h">${plages[p]}</td>` + ALL.map((n, j) => { const c = r.grille[p][j]; if (!c) return '<td></td>';
        return `<td class="${c.type}${nom && c.nom===nom ? ' moi':''}" data-p="${p+1}" data-nom="${c.nom.replace(/"/g,'')}">${court(c.nom)}</td>`; }).join('') + '</tr>';
    }
    $('grille').innerHTML = t + '</tbody></table>';
    parHeure(r, i, nom);
    $('pied').textContent = `Mis à jour : ${data.genere.replace('T',' à ')} · même calcul que l'onglet Salles du classeur de couverture.`;
    window.dispatchEvent(new CustomEvent('forena:rendu', { detail: { r, i, nom, date: data.jours[i].date, plages } }));
  }
  window.FORENA = { get data() { return data; }, rendre, court };
  selJ.onchange = selN.onchange = rendre;
  $('prec').onclick = () => { if (selJ.selectedIndex > 0) { selJ.selectedIndex--; rendre(); } };
  $('suiv').onclick = () => { if (selJ.selectedIndex < selJ.options.length-1) { selJ.selectedIndex++; rendre(); } };
  window.addEventListener('hashchange', () => { const k = data.jours.findIndex(j => j.date === location.hash.slice(1)); if (k >= 0 && k !== Number(selJ.value)) { selJ.value = k; rendre(); } });
  let onglet = null; try { onglet = localStorage.getItem('forena-onglet'); } catch (e) {}
  if (!['moi','plan','heure'].includes(onglet)) onglet = selN.value ? 'moi' : 'plan';
  function choisirOnglet(o) {
    onglet = o; document.body.dataset.onglet = o;
    document.querySelectorAll('#onglets button').forEach(b => b.classList.toggle('on', b.dataset.o === o));
    try { localStorage.setItem('forena-onglet', o); } catch (e) {}
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('#onglets button').forEach(b => b.onclick = () => choisirOnglet(b.dataset.o));
  selN.addEventListener('change', () => { if (selN.value) choisirOnglet('moi'); });
  choisirOnglet(onglet);
  let x0 = null, y0 = null;
  document.querySelector('main').addEventListener('touchstart', e => { if (e.target.closest('.puces,.plan-wrap,.grille-wrap')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.querySelector('main').addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) (dx < 0 ? $('suiv') : $('prec')).click();
  }, { passive: true });
  rendre();
  // recharge les données toutes les 10 minutes si la page reste ouverte
  setInterval(async () => { try { const d2 = await (await fetch('data/plan.json', {cache:'no-store'})).json(); if (d2.genere !== data.genere) { data = d2; rendre(); } } catch (e) {} }, 600000);
})();
</script>
</body>
